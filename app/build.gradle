plugins {
    id 'com.android.application'
}

android {
    namespace 'in.ajaytetarwal.kgpricecalculator'
    compileSdk 35

    defaultConfig {
        applicationId 'in.ajaytetarwal.kgpricecalculator'
        minSdk 23
        targetSdk 35
        versionCode 1
        versionName '1.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }
}
